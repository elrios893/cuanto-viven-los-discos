# Cluster local para el ejercicio "¿Cuánto viven los discos?"
# Reutiliza las imágenes apache/spark:3.5.3 y mongo:7.0 ya descargadas; Kafka corre en modo KRaft (sin Zookeeper).
name: discos

x-spark-worker: &spark-worker
  image: apache/spark:3.5.3
  depends_on: [spark-master]
  volumes:
    - ./src:/opt/jobs
    - ./data:/data
    - ./resultados:/resultados

services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: discos-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    hostname: spark-master
    ports: ["8080:8080", "7077:7077"]
    volumes:
      - ./src:/opt/jobs
      - ./data:/data
      - ./resultados:/resultados

  spark-worker-1:
    <<: *spark-worker
    container_name: discos-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g

  spark-worker-2:
    <<: *spark-worker
    container_name: discos-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g

  kafka:
    image: apache/kafka:3.8.0
    container_name: discos-kafka
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  mongo:
    image: mongo:7.0
    container_name: discos-mongo
    command: mongod --wiredTigerCacheSizeGB 1
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
